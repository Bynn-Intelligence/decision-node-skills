# Release on every push to main: bump the patch in every manifest, push the
# bump commit and its v* tag back to main, and publish server.json to the MCP
# registry. Runs only while the repository is public; a commit whose message
# contains [skip publish] releases nothing, and the bump commit carries it, so
# the push back (made with the default GITHUB_TOKEN, which triggers no workflow
# anyway) never releases again.
#
# The dry-run job runs first on every push to main, public or not: the
# manifests agree on one version, server.json matches the registry schema, the
# published files and the commit messages since the last tag hold no internal
# reference, and the pinned mcp-publisher download matches its checksum. The
# publish job runs only when it passes.
#
# The publish job runs in the GitHub environment "release", which holds the
# registry key and is limited to the main branch (Settings > Environments >
# release > Deployment branches). It needs no reviewer.
#
# Names the owner sets up:
#   environment  release, limited to main
#   secret       MCP_REGISTRY_PRIVATE_KEY, in the environment: the hex Ed25519
#                private key whose public key is published as a TXT record at the
#                apex of decisionnode.com: "v=MCPv1; k=ed25519; p=<base64 key>".
#                It proves the namespace com.decisionnode/* to the registry.
#   secret       DN_NAME_CHECK_WORDS, an organisation secret: the internal names,
#                one lowercase word or phrase a line. Without it the dry run fails.
#
# The plugin itself is not uploaded anywhere: clients read it from this repository.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate the manifests and check every version agrees
        run: |
          python3 hooks/validate_manifests.py
          python3 hooks/check_versions.py

      - name: Validate server.json against the MCP registry schema
        run: |
          set -euo pipefail
          pip install --quiet jsonschema==4.26.0
          schema_url=$(python3 -c "import json;print(json.load(open('server.json'))['\$schema'])")
          curl -fsSL "$schema_url" -o /tmp/server.schema.json
          python3 - <<'EOF'
          import json, sys
          import jsonschema
          schema = json.load(open("/tmp/server.schema.json"))
          data = json.load(open("server.json"))
          errors = list(jsonschema.validators.validator_for(schema)(schema).iter_errors(data))
          for e in errors:
              print(f"::error::server.json {list(e.path)}: {e.message}")
          sys.exit(1 if errors else 0)
          EOF

      # Every tracked file is published: clients read the plugin from this
      # repository. Internal names, internal paths, attribution lines and the
      # boosters production does not serve yet, in any file or commit message
      # since the last tag; a hit prints the file and line, never the text.
      - name: No internal reference in the published files
        env:
          DN_NAME_CHECK_WORDS: ${{ secrets.DN_NAME_CHECK_WORDS }}
        run: python3 .github/scripts/check_names.py --tracked --commits --unserved-everywhere

      - name: Download mcp-publisher and check its checksum
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum --check --strict

  publish:
    if: "github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message || '', '[skip publish]')"
    needs: dry-run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW=$(python3 .github/scripts/bump_version.py)
          python3 hooks/validate_manifests.py
          python3 hooks/check_versions.py
          git add .claude-plugin/marketplace.json server.json plugins/*/.claude-plugin/plugin.json plugins/*/skills/*/SKILL.md
          git commit -m "Release v${NEW} [skip publish]"
          git tag "v${NEW}"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      # The token reaches git as configuration in the environment, never on a
      # command line or on disk. A push that is not a fast-forward (main moved
      # meanwhile) fails here, before anything is published.
      - name: Push the bump commit and the tag to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main "v${VERSION}"

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher

      # mcp-publisher takes the key only on its command line, where every
      # process on the runner can read it. registry_login.py does the same DNS
      # sign-in with the key from the environment, signing through a mode 0600
      # file, and saves the token where mcp-publisher publish reads it.
      - name: Sign in to the registry
        shell: bash
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_REGISTRY_PRIVATE_KEY}" ]; then
            echo "::error::the release environment has no MCP_REGISTRY_PRIVATE_KEY"
            exit 1
          fi
          python3 .github/scripts/registry_login.py --domain decisionnode.com

      - name: Publish server.json
        run: /tmp/mcp-publisher publish
